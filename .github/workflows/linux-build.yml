name: Linux build

# Produces a downloadable tarball (daemon + desktop app) for x86_64 Linux. Built on Ubuntu 22.04
# so it runs on distros with a newer glibc (Arch, Omarchy, ...). The release binary is smoke-tested
# under Xvfb before it is uploaded.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/**"]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "packaging/**"
      - "Cargo.*"
      - ".github/workflows/linux-build.yml"

jobs:
  linux:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 45
    permissions:
      contents: write    # needed by gh release create/upload
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install system libraries
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
            sudo timeout 420 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
              librsvg2-dev xvfb xauth imagemagick x11-utils libgl1-mesa-dri && exit 0
            echo "apt attempt $attempt failed; retrying"; sleep 5
          done
          exit 1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/desktop/src-tauri/target
          key: linux-release-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}
      - name: Build UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Build daemon and desktop app (release)
        run: |
          cargo build --release --locked -p maukode-cli
          cd apps/desktop/src-tauri
          cargo build --release --locked --features custom-protocol
      - name: Stage
        run: |
          set -euo pipefail
          V="$(git describe --tags --always)"
          D="maukode-linux-x86_64-$V"
          mkdir -p "$D"
          cp target/release/maukode "$D/"
          cp apps/desktop/src-tauri/target/release/maukode-desktop "$D/"
          cp apps/desktop/src-tauri/icons/128x128.png "$D/maukode.png"
          cp packaging/linux/{install.sh,maukode-desktop.desktop,README.txt} "$D/"
          strip "$D/maukode" "$D/maukode-desktop"
          echo "D=$D" >> "$GITHUB_ENV"
          echo "max glibc needed:"; objdump -T "$D/maukode-desktop" "$D/maukode" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          echo "shared libs:"; ldd "$D/maukode-desktop" | awk '{print $1}' | sort | head -50
          ! ldd "$D/maukode-desktop" "$D/maukode" | grep "not found"
      - name: Smoke test the release app
        working-directory: apps/desktop
        run: |
          SMOKE_RELEASE=1 SMOKE_APP="$GITHUB_WORKSPACE/$D/maukode-desktop" \
          MAUKODE_BIN="$GITHUB_WORKSPACE/$D/maukode" \
          SMOKE_SCREENSHOT="$PWD/release-shell.png" bash scripts/tauri-smoke.sh
      - name: Package
        run: |
          tar czf "$D.tar.gz" "$D"
          sha256sum "$D.tar.gz" | tee "$D.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: maukode-linux-x86_64
          path: |
            maukode-linux-x86_64-*.tar.gz
            maukode-linux-x86_64-*.tar.gz.sha256
            apps/desktop/release-shell.png
          if-no-files-found: error
      # ── Publish GitHub Release when triggered by a tag push ──────────────
      # On `workflow_dispatch` or branch pushes we only upload artifacts (above).
      # On `v*` tag pushes we also create a proper GitHub Release with the
      # tarball and checksum attached, so users can download from the Releases
      # page instead of hunting for CI artifacts (which expire in 1 day).
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"  # strip leading 'v' to match CHANGELOG [x.y.z] format
          # Extract the CHANGELOG section matching this version.
          # Captures lines between "## [VER]" and the next "## [" heading.
          NOTES="$(awk -v ver="$VER" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) exit          # next section → stop
              match($0, /\[([0-9.]+)\]/, m)
              if (m[1] == ver) capture = 1
              next
            }
            capture { print }
          ' CHANGELOG.md 2>/dev/null || true)"
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}. See CHANGELOG.md for details."
          fi
          # Create release with assets attached. If the release already exists
          # (e.g. re-run), fall back to uploading assets with --clobber.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MauKode ${TAG}" \
            --notes "$NOTES" \
            --verify-tag \
            --latest \
            maukode-linux-x86_64-*.tar.gz \
            maukode-linux-x86_64-*.tar.gz.sha256 \
            || gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            maukode-linux-x86_64-*.tar.gz \
            maukode-linux-x86_64-*.tar.gz.sha256
