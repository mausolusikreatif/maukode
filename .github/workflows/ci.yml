name: Rust CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_web:
        description: Run web UI checks
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test workspace and TUI behavior/performance smoke tests
        run: cargo test --workspace --locked
      - name: TypeScript bindings are up to date
        run: |
          cargo test --locked -p maukode-protocol -p maukode-core -p maukode-server \
            --features maukode-protocol/ts,maukode-core/ts,maukode-server/ts export_bindings
          test -z "$(git status --porcelain -- apps/web/src/api/generated)" || {
            git status --porcelain -- apps/web/src/api/generated
            git diff -- apps/web/src/api/generated
            echo "Generated bindings are stale: regenerate and commit apps/web/src/api/generated"
            exit 1
          }
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  windows:
    # Compile check only (no tests): catches Unix-only code before a release build does.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-windows-
      - name: Check the workspace compiles on Windows
        run: cargo check --workspace --locked

  web:
    if: github.event_name == 'workflow_dispatch' && inputs.run_web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install, typecheck, unit test
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm test
