name: Rust CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_desktop:
        description: Run desktop UI checks
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: [self-hosted, rekarta]
    steps:
      - uses: actions/checkout@v4
      # The self-hosted runner already has Rust stable with rustfmt and clippy. Use it as-is so a
      # flaky link to static.rust-lang.org cannot fail the job; install only if a part is missing.
      - name: Use the runner's Rust toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          installed="$(rustup component list --installed 2>/dev/null || true)"
          if ! grep -q '^clippy' <<<"$installed" || ! grep -q '^rustfmt' <<<"$installed"; then
            rustup toolchain install stable --profile minimal -c rustfmt,clippy
          fi
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test workspace and TUI behavior/performance smoke tests
        run: cargo test --workspace --locked
      - name: TypeScript bindings are up to date
        run: |
          cargo test --locked -p maukode-protocol -p maukode-core -p maukode-server \
            --features maukode-protocol/ts,maukode-core/ts,maukode-server/ts export_bindings
          test -z "$(git status --porcelain -- apps/desktop/src/api/generated)" || {
            git status --porcelain -- apps/desktop/src/api/generated
            git diff -- apps/desktop/src/api/generated
            echo "Generated bindings are stale: regenerate and commit apps/desktop/src/api/generated"
            exit 1
          }
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.run_desktop
    runs-on: [self-hosted, rekarta]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install, typecheck, unit test
        working-directory: apps/desktop
        run: |
          npm ci
          npm run typecheck
          npm test
