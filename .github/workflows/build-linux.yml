name: Build Linux Binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install system libraries
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
            sudo timeout 420 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
              librsvg2-dev libgl1-mesa-dri && exit 0
            echo "apt attempt $attempt failed; retrying"; sleep 5
          done
          exit 1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: tauri-build-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Build the UI bundle and the daemon
        run: |
          cargo build -p maukode-cli --locked
          cd apps/desktop
          npm ci
          npm run build

      - name: Build Tauri binary (no bundle)
        working-directory: apps/desktop
        run: npx tauri build --no-bundle

      - name: Stage artifacts
        run: |
          mkdir -p artifacts/bin
          cp apps/desktop/src-tauri/target/release/maukode-desktop artifacts/bin/maukode-desktop
          cp $(cargo metadata --format-version 1 --manifest-path Cargo.toml | python3 -c "import sys,json; print(json.load(sys.stdin)['target_directory'])")/release/maukode-cli artifacts/bin/maukode-cli 2>/dev/null || true
          ls -la artifacts/bin/

      - uses: actions/upload-artifact@v4
        with:
          name: maukode-linux-x86_64
          path: artifacts/bin/
          retention-days: 7
