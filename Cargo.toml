[workspace]
members = [
    "crates/maukode-protocol",
    "crates/maukode-llm",
    "crates/maukode-tools",
    "crates/maukode-memory",
    "crates/maukode-core",
    "crates/maukode-tui",
    "crates/maukode-cli",
    "crates/maukode-server",
]
resolver = "2"
# The Tauri shell needs system WebView libraries; it is built separately (see apps/desktop).
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["maukode contributors"]

[workspace.dependencies]
# Internal crates
maukode-protocol = { path = "crates/maukode-protocol" }
maukode-llm = { path = "crates/maukode-llm" }
maukode-tools = { path = "crates/maukode-tools" }
maukode-memory = { path = "crates/maukode-memory" }
maukode-core = { path = "crates/maukode-core" }
maukode-tui = { path = "crates/maukode-tui" }
maukode-server = { path = "crates/maukode-server" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"
ring = "0.17"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# HTTP server, client & SSE streaming
axum = { version = "0.8", features = ["json", "tokio", "http1", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"
tokio-stream = { version = "0.1", features = ["sync"] }

# CLI & Terminal UI
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"

# Database & Storage
rusqlite = { version = "0.40", features = ["bundled"] }

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
ts-rs = { version = "12", features = ["serde-json-impl", "chrono-impl", "uuid-impl"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
ignore = "0.4"
walkdir = "2.5"
similar = "2.6"
dirs = "7.0"
pulldown-cmark = "0.13"
tokio-util = "0.7"
tempfile = "3.17"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

# Tree-sitter & AST Grammars
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
